  <g transform="translate(256 256)">
    <path d="M168 0L84 145.5H-84L-168 0L-84-145.5H84Z" transform="rotate(15)" fill="#ffffff" stroke="#ffffff" stroke-width="28" stroke-linejoin="round"/>
    <g transform="rotate(-15)">
      <path d="M0-86A86 86 0 0 0 0 86Z" fill="#2a6ad1"/>
      <path d="M0-86A86 86 0 0 1 0 86Z" fill="#fb4712"/>
    </g>
  </g>
</svg>
