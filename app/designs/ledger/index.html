<!doctype html>
<html lang="en" data-theme="light" data-face="typewriter" data-mode="write" data-format="basic" data-tape="folded">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Ten Dollar Words (Ledger)</title>
  <meta name="description" content="Ten Dollar Words: a writing app where every word costs $10.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eef5f3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- One request: engraved figures, the UI grotesk, the receipt mono, the three writing faces, and the Traditional Chinese fallbacks. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&amp;family=Public+Sans:ital,wght@0,300..700;1,400..600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=Cactus+Classical+Serif&amp;family=Noto+Serif+TC:wght@400;700&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="css/tokens.css?v=2.1.0">
  <link rel="stylesheet" href="css/page.css?v=2.1.0">
  <link rel="stylesheet" href="css/ledger.css?v=2.1.0">
</head>
<body>
  <header id="masthead" class="masthead">
    <div class="mh-left">
      <button id="btn-drafts" class="mh-btn mh-book" type="button" aria-haspopup="dialog" title="Drafts: the ledger book"><span class="mh-ico" data-icon="book"></span><span class="mh-text">Drafts</span></button>
      <button id="balance-pill" class="balance-pill" type="button" title="Balance: open the tape"></button>
      <div class="mh-where">
        <span id="mh-title" class="mh-title"></span>
        <button id="sync-status" class="mh-status" type="button" hidden></button>
        <span id="save-status" class="mh-save" aria-live="polite"></span>
      </div>
    </div>
    <div class="mh-right">
      <button id="btn-paper" class="mh-btn mh-paper" type="button" aria-haspopup="menu"><span class="mh-k">Paper</span><span id="paper-label">Basic</span><span class="mh-ico mh-chev" data-icon="chevDown"></span></button>
      <div id="mode-slot" class="mode-slot"></div>
      <button id="btn-share" class="mh-btn mh-share" type="button" aria-haspopup="menu" data-menu-align="end"><span class="mh-ico" data-icon="share"></span><span class="mh-text">Share</span></button>
      <button id="btn-more" class="mh-btn mh-icon mh-more" type="button" aria-haspopup="menu" aria-label="Paper and share" data-menu-align="end"><span class="mh-ico" data-icon="more"></span></button>
      <button id="btn-settings" class="mh-btn mh-icon" type="button" aria-label="Settings" title="Settings"><span class="mh-ico" data-icon="sliders"></span></button>
    </div>
  </header>

  <main id="page" class="page">
    <div class="paper">
      <div id="sheet" class="sheet">
        <div id="surface" class="surface">
          <div id="under" class="under" aria-hidden="true"></div>
          <div id="editor" class="editor" role="textbox" aria-multiline="true" aria-label="Your draft"
            spellcheck="false" autocapitalize="sentences" autocorrect="off" translate="no"
            data-placeholder="Start typing. Every word costs $10."></div>
          <div id="aids" class="aids"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- The register tape. Write mode: rolled up, only the balance shows. Edit mode: it feeds out. -->
  <aside id="tape" class="tape" aria-label="Register tape">
    <button id="panel-handle" class="tape-grip" type="button" aria-expanded="false" aria-controls="tape">
      <span class="grip-bar" aria-hidden="true"></span>
      <span id="panel-summary" class="grip-summary"></span>
    </button>
    <section id="register" class="register" aria-label="Balance">
      <div class="reg-guilloche" aria-hidden="true"></div>
      <button id="reg-main" class="reg-main" type="button" title="Show the tape (⌘E)">
        <span id="reg-label" class="reg-label">Balance</span>
        <span id="reg-figure" class="reg-figure"></span>
      </button>
      <div class="reg-meter" aria-hidden="true"><div id="reg-fill" class="reg-fill"></div></div>
      <div class="reg-foot">
        <span class="reg-line"><span id="reg-spent">$0</span> spent of <button id="reg-budget" class="reg-budget" type="button" title="Change the budget">$2,000</button></span>
        <span id="reg-grade" class="reg-grade"></span>
      </div>
      <div id="reg-sel" class="reg-sel" aria-live="off"></div>
      <div id="reg-stamp" class="stamp" hidden>Over budget</div>
      <form id="budget-form" class="budget-form" hidden>
        <label for="budget-input">Budget for this draft</label>
        <div id="budget-presets" class="presets" role="group" aria-label="Budgets"></div>
        <div class="row-end">
          <div class="money-input"><span>$</span><input id="budget-input" type="number" min="10" step="10" inputmode="numeric"></div>
          <button type="button" id="budget-cancel" class="btn-quiet">Cancel</button>
          <button type="submit" class="btn">Set</button>
        </div>
      </form>
    </section>
    <div id="tape-body" class="tape-body">
      <div id="tape-pinned" class="tape-pinned"></div>
      <div id="tape-main" class="tape-main">
        <div class="tape-tabs" role="tablist" aria-label="Tape">
          <button class="tape-tab" role="tab" type="button" data-view="receipt" aria-selected="true">Receipt</button>
          <button class="tape-tab" role="tab" type="button" data-view="notes" aria-selected="false">Notes<span id="notes-count" class="tab-count"></span></button>
          <button class="tape-tab" role="tab" type="button" data-view="overflow" aria-selected="false">Overflow</button>
          <button id="tape-fold" class="btn-icon tape-fold" type="button" aria-label="Roll up the tape" title="Roll up (Esc)"></button>
        </div>
        <div id="tape-scroll" class="tape-scroll">
          <section id="tab-receipt" class="tape-view" data-view="receipt" aria-label="Receipt">
            <ol id="items" class="items" aria-label="Paragraphs and what they cost"></ol>
            <div id="items-empty" class="tape-empty" hidden>
              <p>Every paragraph prints here with what it costs.</p>
              <button id="btn-sample" type="button" class="btn-outline btn-sm">Try sample text</button>
            </div>
            <dl id="totals" class="totals"></dl>
            <div id="trim-row" class="trim-row"></div>
            <section id="refunds" class="refunds" aria-label="Refunds available">
              <h3 class="tape-h"><span>Refunds available</span><span id="refund-total" class="tape-h-fig"></span></h3>
              <ul id="refund-list" class="refund-list"></ul>
              <p id="refunds-hidden" class="tape-note" hidden></p>
            </section>
            <div id="tools" class="tools"></div>
          </section>
          <section id="tab-notes" class="tape-view" data-view="notes" aria-label="Notes" hidden></section>
          <section id="tab-overflow" class="tape-view" data-view="overflow" aria-label="Overflow" hidden></section>
        </div>
        <div id="tape-overlay" class="tape-overlay" hidden></div>
      </div>
    </div>
  </aside>

  <dialog id="drafts-dialog" class="book" aria-labelledby="drafts-title"></dialog>
  <dialog id="settings-dialog" class="settings" aria-labelledby="settings-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/data.js?v=2.1.0"></script>
  <script src="js/inline.js?v=2.1.0"></script>
  <script src="js/engine.js?v=2.1.0"></script>
  <script src="js/marks.js?v=2.1.0"></script>
  <script src="js/spell.js?v=2.1.0"></script>
  <script src="js/notion-map.js?v=2.1.0"></script>
  <script src="js/sound.js?v=2.1.0"></script>
  <script src="js/store.js?v=2.1.0"></script>
  <script src="js/ai.js?v=2.1.0"></script>
  <script src="js/ai-mock.js?v=2.1.0"></script>
  <script src="js/notion.js?v=2.1.0"></script>
  <script src="js/sync.js?v=2.1.0"></script>
  <script src="js/vault.js?v=2.1.0"></script>
  <script src="js/account.js?v=2.1.0"></script>
  <script src="js/formats.js?v=2.1.0"></script>
  <script src="js/editor.js?v=2.1.0"></script>
  <script src="js/ui.js?v=2.1.0"></script>
  <script src="js/tape.js?v=2.1.0"></script>
  <script src="js/panel.js?v=2.1.0"></script>
  <script src="js/popover.js?v=2.1.0"></script>
  <script src="js/dialogs.js?v=2.1.0"></script>
  <script src="js/alts.js?v=2.1.0"></script>
  <script src="js/menu.js?v=2.1.0"></script>
  <script src="js/overflow.js?v=2.1.0"></script>
  <script src="js/lab.js?v=2.1.0"></script>
  <script src="js/challenges.js?v=2.1.0"></script>
  <script src="js/challenge-ui.js?v=2.1.0"></script>
  <script src="js/desk.js?v=2.1.0"></script>
  <script src="js/blocks.js?v=2.1.0"></script>
  <script src="js/notes.js?v=2.1.0"></script>
  <script src="js/bubble.js?v=2.1.0"></script>
  <script src="js/app.js?v=2.1.0"></script>
</body>
</html>
