<!doctype html>
<html lang="en" data-theme="light" data-font="serif" data-mode="write" data-format="basic" data-view="page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Ten Dollar Words (Studio)</title>
  <meta name="description" content="Ten Dollar Words: a writing app where every word costs $10.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eef1e8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- One request for every font: the UI face, the four writing fonts, and the Traditional Chinese fallbacks. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&amp;family=Literata:ital,opsz,wght@0,7..72,300..800;1,7..72,300..800&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&amp;family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&amp;family=Cactus+Classical+Serif&amp;family=Noto+Serif+TC:wght@400;700&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="css/studio.css?v=2.1.0">
  <link rel="stylesheet" href="css/page.css?v=2.1.0">
  <link rel="stylesheet" href="css/inspector.css?v=2.1.0">
  <link rel="stylesheet" href="css/settings.css?v=2.1.0">
</head>
<body>
  <!-- The library: every draft, grouped by its Notion stage. On a phone it's the home screen. -->
  <aside id="library" class="library" aria-label="Library">
    <div class="lib-phone-bar">
      <button id="lib-settings-phone" class="icon-btn" type="button" aria-label="Settings"></button>
      <button id="lib-new-phone" class="icon-btn" type="button" aria-label="New draft"></button>
    </div>
    <h1 class="lib-large-title">Drafts</h1>
    <div class="lib-head">
      <label class="lib-search">
        <span class="lib-search-icon" aria-hidden="true"></span>
        <input id="lib-search" type="search" placeholder="Search" aria-label="Search drafts" autocomplete="off" spellcheck="false">
      </label>
      <button id="lib-new" class="icon-btn" type="button" aria-label="New draft"></button>
    </div>
    <nav id="lib-list" class="lib-list" aria-label="Drafts"></nav>
    <div class="lib-foot">
      <button id="sync-status" class="sync-line" type="button"></button>
      <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings"></button>
    </div>
  </aside>

  <!-- The page's toolbar. Its bottom hairline is the budget: it fills with plum as you spend. -->
  <header id="toolbar" class="toolbar">
    <div class="tb-left">
      <button id="btn-lib" class="icon-btn tb-lib" type="button"></button>
      <button id="btn-back" class="tb-back" type="button" aria-label="Back to drafts"><span class="tb-back-icon" aria-hidden="true"></span><span class="tb-back-label">Drafts</span></button>
      <span id="tb-title" class="tb-title"></span>
      <span id="save-status" class="save-status" aria-live="polite"></span>
    </div>
    <div class="tb-right">
      <span id="tb-challenge-slot" class="tb-slot"></span>
      <span id="tb-count" class="tb-count" aria-live="off"></span>
      <button id="spend-chip" class="spend-chip" type="button" aria-haspopup="dialog"></button>
      <span class="tb-sep" aria-hidden="true"></span>
      <button id="format-btn" class="tb-btn tb-format" type="button" aria-haspopup="menu"></button>
      <button id="nb-btn" class="icon-btn tb-nb" type="button" aria-pressed="false"></button>
      <button id="share-btn" class="tb-btn tb-share" type="button" aria-haspopup="menu"></button>
      <span class="tb-sep" aria-hidden="true"></span>
      <button id="btn-insp" class="icon-btn tb-insp" type="button"></button>
    </div>
    <div id="money-rule" class="money-rule" aria-hidden="true"><span class="money-fill"></span></div>
  </header>

  <main id="page" class="page">
    <div id="sheet" class="sheet">
      <div id="surface" class="surface">
        <div id="under" class="under" aria-hidden="true"></div>
        <div id="editor" class="editor" role="textbox" aria-multiline="true" aria-label="Your draft"
          spellcheck="false" autocapitalize="sentences" autocorrect="off" translate="no"
          data-placeholder="Start typing. Every word costs $10."></div>
        <div id="aids" class="aids"></div>
      </div>
    </div>
  </main>

  <!-- Phone: the page's toolbar sits at the bottom, on top of the keyboard. -->
  <nav id="phone-bar" class="phone-bar" aria-label="Page tools">
    <button id="pb-format" class="pb-btn" type="button" aria-haspopup="menu"></button>
    <button id="pb-review" class="pb-btn" type="button"></button>
    <button id="pb-share" class="pb-btn" type="button" aria-haspopup="menu"></button>
  </nav>

  <!-- The inspector: one tab per tool. On a phone it's a sheet from the bottom. -->
  <aside id="inspector" class="inspector" aria-label="Inspector">
    <button id="panel-handle" class="insp-grabber" type="button" aria-label="Resize the inspector"></button>
    <div id="insp-tabs" class="insp-tabs" role="tablist" aria-label="Inspector"></div>
    <div id="insp-body" class="insp-body">
      <section id="tab-review" class="insp-pane" role="tabpanel" aria-labelledby="tabbtn-review">
        <div id="panel" class="review">
          <section id="register" class="rv-sec register" aria-label="Spend">
            <div class="rv-label">Spent</div>
            <div class="reg-line">
              <span class="reg-amount"><span class="cur">$</span><span id="reg-spent">0</span></span>
              <span class="reg-of">of <button id="reg-budget" class="link-btn" type="button">$2,000</button></span>
              <span id="reg-stamp" class="reg-stamp" hidden>Over budget</span>
            </div>
            <dl id="reg-stats" class="reg-stats"></dl>
          </section>
          <section id="readability" class="rv-sec" aria-label="Readability">
            <div class="rv-row">
              <span class="rv-label">Readability</span>
              <span class="grade-row"><span id="grade-num" class="grade">Grade —</span><span id="grade-pill" class="pill" hidden></span></span>
            </div>
          </section>
          <section id="issues" class="rv-sec" aria-label="Fixes">
            <div class="rv-label">Fixes</div>
            <ul id="issue-list" class="issue-list"></ul>
            <div id="issues-empty" class="rv-empty" hidden>
              <p>Nothing to check yet.</p>
              <button id="btn-sample" type="button" class="btn btn-quiet">Try sample text</button>
            </div>
          </section>
          <section id="ai-desk" class="rv-sec" aria-label="AI help">
            <div class="rv-label">AI</div>
            <div class="ai-actions">
              <button id="ai-message" type="button" class="btn">Check the message</button>
            </div>
            <p id="ai-note" class="hint"></p>
          </section>
          <section id="ai-results" class="rv-sec ai-results" hidden aria-live="polite">
            <button id="ai-back" type="button" class="btn btn-quiet btn-back"></button>
            <div id="ai-body"></div>
          </section>
        </div>
      </section>
      <section id="tab-lab" class="insp-pane" role="tabpanel" aria-labelledby="tabbtn-lab" hidden></section>
      <section id="tab-challenge" class="insp-pane" role="tabpanel" aria-labelledby="tabbtn-challenge" hidden></section>
      <section id="tab-overflow" class="insp-pane" role="tabpanel" aria-labelledby="tabbtn-overflow" hidden></section>
      <section id="tab-notes" class="insp-pane" role="tabpanel" aria-labelledby="tabbtn-notes" hidden></section>
      <section id="tab-draft" class="insp-pane" role="tabpanel" aria-labelledby="tabbtn-draft" hidden></section>
      <section id="tab-alts" class="insp-pane" role="tabpanel" aria-labelledby="tabbtn-alts" hidden></section>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <dialog id="settings-dialog" class="prefs" aria-labelledby="settings-title"></dialog>
  <dialog id="keys-dialog" class="keys" aria-labelledby="keys-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/data.js?v=2.1.0"></script>
  <script src="js/inline.js?v=2.1.0"></script>
  <script src="js/engine.js?v=2.1.0"></script>
  <script src="js/marks.js?v=2.1.0"></script>
  <script src="js/spell.js?v=2.1.0"></script>
  <script src="js/notion-map.js?v=2.1.0"></script>
  <script src="js/sound.js?v=2.1.0"></script>
  <script src="js/store.js?v=2.1.0"></script>
  <script src="js/ai.js?v=2.1.0"></script>
  <script src="js/ai-mock.js?v=2.1.0"></script>
  <script src="js/notion.js?v=2.1.0"></script>
  <script src="js/sync.js?v=2.1.0"></script>
  <script src="js/vault.js?v=2.1.0"></script>
  <script src="js/account.js?v=2.1.0"></script>
  <script src="js/formats.js?v=2.1.0"></script>
  <script src="js/editor.js?v=2.1.0"></script>
  <script src="js/ui.js?v=2.1.0"></script>
  <script src="js/inspector.js?v=2.1.0"></script>
  <script src="js/panel.js?v=2.1.0"></script>
  <script src="js/popover.js?v=2.1.0"></script>
  <script src="js/library.js?v=2.1.0"></script>
  <script src="js/dialogs.js?v=2.1.0"></script>
  <script src="js/alts.js?v=2.1.0"></script>
  <script src="js/menu.js?v=2.1.0"></script>
  <script src="js/overflow.js?v=2.1.0"></script>
  <script src="js/lab.js?v=2.1.0"></script>
  <script src="js/challenges.js?v=2.1.0"></script>
  <script src="js/challenge-ui.js?v=2.1.0"></script>
  <script src="js/desk.js?v=2.1.0"></script>
  <script src="js/blocks.js?v=2.1.0"></script>
  <script src="js/notes.js?v=2.1.0"></script>
  <script src="js/bubble.js?v=2.1.0"></script>
  <script src="js/app.js?v=2.1.0"></script>
</body>
</html>
