<!doctype html>
<html lang="en" data-theme="light" data-font="serif" data-mode="write" data-format="basic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ten Dollar Words</title>
  <meta name="description" content="Ten Dollar Words: a writing app where every word costs $10.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The page's serif, the typewriter option, and the Traditional Chinese fallback. The UI is the system font. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..800;1,8..60,300..800&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&amp;family=Noto+Serif+TC:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.1.1">
  <link rel="stylesheet" href="css/page.css?v=3.1.1">
  <link rel="stylesheet" href="css/margin.css?v=3.1.1">
  <link rel="stylesheet" href="css/surfaces.css?v=3.1.1">
</head>
<body>
  <!-- Drafts: a sidebar that comes over from the left edge (a sheet on a phone). -->
  <div id="drafts-edge" class="drafts-edge" aria-hidden="true"></div>
  <aside id="drafts" class="drafts" aria-labelledby="drafts-title"></aside>
  <!-- The spine: the draft on the left, what it has cost on the right, and the command palette. -->
  <header id="spine" class="spine">
    <div class="spine-left">
      <button id="spine-title" class="spine-title" type="button" aria-controls="drafts" aria-expanded="false">
        <span class="spine-title-text">Untitled</span>
      </button>
      <button id="spine-stage" class="spine-stage" type="button" aria-haspopup="menu" hidden></button>
    </div>
    <div class="spine-right">
      <span id="spine-notes" class="spine-notes" hidden></span>
      <button id="spine-spend" class="spine-spend" type="button" aria-haspopup="dialog">
        <span class="spend-amt">$0</span><span class="spend-of"> of $2,000</span>
      </button>
      <button id="spine-sync" class="spine-sync" type="button" hidden><span class="sync-dot" aria-hidden="true"></span></button>
      <button id="spine-more" class="spine-more" type="button" aria-haspopup="dialog" aria-label="Commands"></button>
    </div>
  </header>

  <main id="page" class="page">
    <div id="sheet" class="sheet">
      <div id="surface" class="surface">
        <div id="gutter" class="gutter" aria-hidden="true"></div>
        <div id="under" class="under" aria-hidden="true"></div>
        <div id="editor" class="editor" role="textbox" aria-multiline="true" aria-label="Your draft"
          spellcheck="false" autocapitalize="sentences" autocorrect="off" translate="no"
          data-placeholder="Start writing. Every word costs $10."></div>
        <div id="aids" class="aids"></div>
        <div id="chips" class="chips"></div>
        <div id="margin" class="margin" aria-label="Margin"></div>
      </div>
    </div>
  </main>

  <!-- The margin's fixed parts: its switcher, a panel for Overflow, and cards pinned at its foot. -->
  <div id="margin-head" class="margin-head" hidden></div>
  <div id="margin-panel" class="margin-panel" hidden></div>
  <div id="margin-foot" class="margin-foot" aria-live="polite"></div>

  <dialog id="palette" class="palette" aria-label="Commands"></dialog>
  <dialog id="drafts-dialog" class="drafts-sheet" aria-label="Drafts"></dialog>
  <dialog id="settings-dialog" class="settings" aria-labelledby="settings-title"></dialog>
  <dialog id="tally" class="tally" aria-label="Spend and budget"></dialog>
  <dialog id="margin-sheet" class="margin-sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/data.js?v=3.1.1"></script>
  <script src="js/inline.js?v=3.1.1"></script>
  <script src="js/engine.js?v=3.1.1"></script>
  <script src="js/marks.js?v=3.1.1"></script>
  <script src="js/spell.js?v=3.1.1"></script>
  <script src="js/notion-map.js?v=3.1.1"></script>
  <script src="js/sound.js?v=3.1.1"></script>
  <script src="js/store.js?v=3.1.1"></script>
  <script src="js/ai.js?v=3.1.1"></script>
  <script src="js/ai-mock.js?v=3.1.1"></script>
  <script src="js/notion.js?v=3.1.1"></script>
  <script src="js/sync.js?v=3.1.1"></script>
  <script src="js/vault.js?v=3.1.1"></script>
  <script src="js/account.js?v=3.1.1"></script>
  <script src="js/formats.js?v=3.1.1"></script>
  <script src="js/keys.js?v=3.1.1"></script>
  <script src="js/editor.js?v=3.1.1"></script>
  <script src="js/ui.js?v=3.1.1"></script>
  <script src="js/spine.js?v=3.1.1"></script>
  <script src="js/margin.js?v=3.1.1"></script>
  <script src="js/review.js?v=3.1.1"></script>
  <script src="js/drafts.js?v=3.1.1"></script>
  <script src="js/dialogs.js?v=3.1.1"></script>
  <script src="js/alts.js?v=3.1.1"></script>
  <script src="js/menu.js?v=3.1.1"></script>
  <script src="js/overflow.js?v=3.1.1"></script>
  <script src="js/lab.js?v=3.1.1"></script>
  <script src="js/challenges.js?v=3.1.1"></script>
  <script src="js/challenge-ui.js?v=3.1.1"></script>
  <script src="js/desk.js?v=3.1.1"></script>
  <script src="js/blocks.js?v=3.1.1"></script>
  <script src="js/notes.js?v=3.1.1"></script>
  <script src="js/bubble.js?v=3.1.1"></script>
  <script src="js/links.js?v=3.1.1"></script>
  <script src="js/fx.js?v=3.1.1"></script>
  <script src="js/bench.js?v=3.1.1"></script>
  <script src="js/palette.js?v=3.1.1"></script>
  <script src="js/app.js?v=3.1.1"></script>
</body>
</html>
